name: Tests
on:
  push:
    branches: [main]
  pull_request:
jobs:
  tests:
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    strategy:
      matrix:
        os: [ubuntu-24.04, macos-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          version: "0.12.23"
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Install and verify tools
        env:
          UV_CACHE_DIR: ${{ runner.temp }}/uv-cache
          EMEND_TOOLS_DIR: ${{ runner.temp }}/emend-tools
        run: bash scripts/setup-cloud.sh
      - name: Install optional visual renderer and Chromium
        run: uv sync --frozen --extra visual && uv run --extra visual playwright install --with-deps chromium
      - name: Install official Ace CLI
        env:
          EMEND_ACE_DIR: ${{ runner.temp }}/emend-ace
          PUPPETEER_CACHE_DIR: ${{ runner.temp }}/puppeteer
        run: bash scripts/setup-ace.sh
      - name: Install official Calibre CLI and rclone (Linux)
        if: runner.os == 'Linux'
        env:
          UV_CACHE_DIR: ${{ runner.temp }}/uv-cache
          EMEND_CALIBRE_DIR: ${{ runner.temp }}/emend-calibre
        run: |
          set +e
          (
            sudo apt-get update &&
            sudo apt-get install --no-install-recommends -y rclone libegl1 libopengl0 libxcb-cursor0 &&
            bash scripts/setup-calibre.sh
          ) > "$RUNNER_TEMP/emend-calibre-setup.log" 2>&1
          emend_setup_status=$?
          set -e
          cat "$RUNNER_TEMP/emend-calibre-setup.log"
          if [ "$emend_setup_status" -ne 0 ]; then
            python3 - <<'PYDIAG'
          import os
          from pathlib import Path
          message = (Path(os.environ["RUNNER_TEMP"]) / "emend-calibre-setup.log").read_text(errors="replace")[-3000:]
          message = message.replace("%", "%25").replace("\r", "%0D").replace("\n", "%0A")
          print(f"::error::Calibre setup failed: {message}")
          PYDIAG
            exit "$emend_setup_status"
          fi
      - name: Install official Calibre CLI and rclone (macOS)
        if: runner.os == 'macOS'
        env:
          EMEND_CALIBRE_DIR: ${{ runner.temp }}/emend-calibre
        run: |
          set +e
          (
            brew install rclone &&
            bash scripts/setup-calibre.sh
          ) > "$RUNNER_TEMP/emend-calibre-setup.log" 2>&1
          emend_setup_status=$?
          set -e
          cat "$RUNNER_TEMP/emend-calibre-setup.log"
          if [ "$emend_setup_status" -ne 0 ]; then
            python3 - <<'PYDIAG'
          import os
          from pathlib import Path
          message = (Path(os.environ["RUNNER_TEMP"]) / "emend-calibre-setup.log").read_text(errors="replace")[-3000:]
          message = message.replace("%", "%25").replace("\r", "%0D").replace("\n", "%0A")
          print(f"::error::Calibre setup failed: {message}")
          PYDIAG
            exit "$emend_setup_status"
          fi
      - run: uv run --extra visual ruff check . && uv run --extra visual ruff format --check .
      - name: Run regression tests with external integrations
        env:
          EMEND_TEST_EPUBCHECK_JAR: ${{ runner.temp }}/emend-tools/epubcheck-5.3.0/epubcheck.jar
          EMEND_TEST_PLAYWRIGHT: "1"
          EMEND_TEST_ACE: ${{ runner.temp }}/emend-ace/node_modules/.bin/ace-cli
          # Ace defaults to 5s, which can expire on a cold hosted browser launch.
          ACE_TIMEOUT_INITIAL: "30000"
          PUPPETEER_CACHE_DIR: ${{ runner.temp }}/puppeteer
          EMEND_TEST_CALIBRE_BIN: ${{ runner.os == 'Linux' && format('{0}/emend-calibre', runner.temp) || format('{0}/emend-calibre/calibre.app/Contents/MacOS', runner.temp) }}
        run: uv run --extra visual pytest -q --junitxml="${{ runner.temp }}/emend-tests.xml"
      - name: Build distributions
        run: uv build
      - name: Annotate test failures
        if: failure()
        run: |
          python3 - <<'PY'
          import os
          from pathlib import Path
          import xml.etree.ElementTree as ET

          report = Path(os.environ["RUNNER_TEMP"]) / "emend-tests.xml"
          if report.is_file():
              for case in ET.parse(report).iter("testcase"):
                  for problem in case:
                      if problem.tag in {"failure", "error"}:
                          message = case.get("name", "Test failure") + "\n" + (problem.text or "")
                          if len(message) > 3800:
                              message = message[:3800] + "\n[See the job log for the full failure.]"
                          message = message.replace("%", "%25").replace("\r", "%0D").replace("\n", "%0A")
                          print(f"::error::{message}")
          PY
