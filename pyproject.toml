[build-system]
requires = ["hatchling>=1.27,<2"]
build-backend = "hatchling.build"

[project]
name = "emend"
version = "0.17.0"
description = "A preservation-first EPUB inspector and gated publishing pipeline"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
  "lxml>=5.3,<7",
  "pillow>=11,<13",
  "pydantic>=2.10,<3",
  "pyyaml>=6,<7",
  "tinycss2>=1.4,<2",
  "typer>=0.15,<1",
]

[project.optional-dependencies]
visual = ["playwright>=1.51,<2"]

[project.scripts]
emend = "emend.cli:app"

[dependency-groups]
dev = ["pytest>=8.3,<10", "ruff>=0.11,<1"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
ignore = ["E501"]
